<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Messages · Mesh</title>
<link rel="stylesheet" href="/style.css">
<link rel="stylesheet" href="/theme.css">
<link rel="stylesheet" href="/communaute.css">
<link rel="stylesheet" href="mesh.css">
<script src="/langue.js"></script>
<script src="mesh.js"></script>
</head>
<body>
<main>
  <div id="entete"></div>
  <!-- Ecrire : a tout un canal, ou a une seule radio (message direct, avec accuse de reception) -->
  <form class="form" id="ecrire" hidden>
    <label for="dest" data-en="To">À</label>
    <select class="champ" id="dest"></select>
    <textarea class="champ" id="texte" rows="2" placeholder="Votre message" data-en-ph="Your message"></textarea>
    <div class="bas-form"><span class="compte-octets" id="octets"></span><button class="bouton" id="envoyer" disabled data-en="Send">Envoyer</button></div>
    <p class="erreur" id="erreur"></p>
  </form>
  <div class="puces" id="canaux"></div>
  <div class="lignes" id="journal"></div>
  <div class="complet-seul">
    <h2 class="avec-aide"><span data-en="History">Historique</span><button class="aide-bouton" type="button" data-aide="aide-histo">?</button></h2>
    <p class="aide" id="aide-histo" hidden data-en="Every text message heard or sent by the station, kept as long as set in Settings > Mesh (90 days at first). Search by word or by radio.">Tous les messages texte entendus ou envoyés par la station, gardés aussi longtemps que réglé dans Paramètres > Mesh (90 jours au départ). Cherchez par mot ou par radio.</p>
    <form class="form" id="form-histo"><div class="deux"><input class="champ" id="h-mot" placeholder="Mot ou radio" data-en-ph="Word or radio" autocomplete="off">
      <select class="champ" id="h-duree"><option value="1">24 h</option><option value="7" selected>7 jours</option><option value="30">30 jours</option><option value="365">tout</option></select></div>
      <button class="bouton secondaire" data-en="Search">Chercher</button></form>
    <div class="lignes" id="histo"></div>
  </div>
</main>
<script>
// Messages radio : tous les canaux et les messages directs, recus et emis (plan radio R1-R2, section Mesh).
entete('messages', 'Messages', 'Messages');
aides();
var filtre = 'tout', journal = [];
var demande = new URLSearchParams(location.search);

function nomCanal(i) {
  var c = ((station.details || {}).canaux || []).filter(function (x) { return x.index === i; })[0];
  return c ? c.nom : T('Canal ', 'Channel ') + i;
}
function afficherJournal() {
  var j = journal.slice().reverse(), canaux = (station.details || {}).canaux || [], vus = {};
  canaux.forEach(function (c) { vus[c.index] = true; });
  j.forEach(function (m) { if (!m.direct) vus[m.canal || 0] = true; });
  var choix = [['tout', T('Tout', 'All')]];
  Object.keys(vus).sort().forEach(function (i) { choix.push(['c' + i, nomCanal(+i)]); });
  if (j.some(function (m) { return m.direct; })) choix.push(['direct', T('Messages directs', 'Direct messages')]);
  if (!choix.some(function (c) { return c[0] === filtre; })) filtre = 'tout';
  var zc = $('canaux'); zc.innerHTML = '';
  choix.forEach(function (c) {
    var b = el('button', 'puce' + (c[0] === filtre ? ' choisie' : ''), c[1]);
    b.onclick = function () { filtre = c[0]; afficherJournal(); };
    zc.appendChild(b);
  });
  var liste = j.filter(function (m) { return filtre === 'tout' || (filtre === 'direct' ? m.direct : !m.direct && 'c' + (m.canal || 0) === filtre); });
  var zone = $('journal'); zone.innerHTML = '';
  if (!liste.length) { zone.appendChild(el('p', 'rien', T('Aucun message radio pour l’instant.', 'No radio message yet.'))); return; }
  liste.forEach(function (m) { zone.appendChild(ligneMessage(m, true)); });
}
function ligneMessage(m, repondre) {
  var c = el('div', 'ligne-m'), haut = el('div', 'haut');
  var qui = m.sens === 'emis' ? T('La station', 'The station') + (m.direct ? ' → ' + (m.nom_a || m.a) : '') : m.nom;
  haut.appendChild(el('b', '', qui));
  haut.appendChild(el('span', 'heure', heure(m.heure)));
  if (m.direct) haut.appendChild(el('span', 'mot', T('direct', 'direct')));
  else if (filtre === 'tout' && m.canal !== undefined && m.canal !== null) haut.appendChild(el('span', 'mot', nomCanal(m.canal || 0)));
  if (m.sens === 'emis') haut.appendChild(el('span', 'mot', T('envoyé', 'sent')));
  if (m.sens === 'emis' && m.statut) {
    var ST = { attente: [T('en attente de réponse', 'waiting for reply'), ''], remis: [T('remis', 'delivered'), 'bien'], echec: [T('non remis', 'not delivered'), 'alerte'] };
    var st = ST[m.statut] || [m.statut, ''];
    haut.appendChild(el('span', 'statut ' + st[1], st[0] + (m.statut === 'echec' && m.raison && MODE === 'complet' ? ' (' + m.raison + ')' : '')));
  }
  if (repondre && m.sens === 'recu' && m.de && station.etat.active) {
    var rep = el('button', 'lien', T('Répondre', 'Reply')); rep.type = 'button'; rep.style.marginLeft = 'auto';
    rep.onclick = function () { choisirDest('n:' + m.de, m.nom); $('texte').focus(); scrollTo(0, $('ecrire').offsetTop - 20); };
    haut.appendChild(rep);
  }
  c.appendChild(haut);
  c.appendChild(el('div', 'texte', m.texte));
  var sig = [];
  if (typeof m.snr === 'number') sig.push('SNR ' + virgule(m.snr) + ' dB');
  if (m.rssi) sig.push('RSSI ' + m.rssi + ' dBm');
  var s = sauts(m.sauts); if (s) sig.push(s);
  if (sig.length) c.appendChild(el('div', 'signal', sig.join(' · ')));
  return c;
}

// ----- Ecrire
function choisirDest(valeur, nom) {
  var s = $('dest');
  if (![].some.call(s.options, function (o) { return o.value === valeur; })) {
    var o = el('option', '', nom + T(' (message direct)', ' (direct message)')); o.value = valeur; s.appendChild(o);
  }
  s.value = valeur;
}
function afficherEcrire() {
  $('ecrire').hidden = !station.etat.active;
  var d = station.details || {}, s = $('dest'), avant = s.value, choix = [];
  (d.canaux || [{ index: 0, nom: T('canal principal', 'primary channel') }]).forEach(function (c) { choix.push(['c:' + c.index, T('Tout le monde · ', 'Everyone · ') + c.nom]); });
  (d.noeuds || []).forEach(function (n) { choix.push(['n:' + n.id, n.nom + T(' (message direct)', ' (direct message)')]); });
  var cle = JSON.stringify(choix);
  if (s.dataset.cle !== cle) {
    s.dataset.cle = cle; s.innerHTML = '';
    choix.forEach(function (c) { var o = el('option', '', c[1]); o.value = c[0]; s.appendChild(o); });
    if (avant) choisirDest(avant, avant.slice(2));
  }
  compter();
}
function compter() {
  var max = (station && station.etat.max) || 228, n = octets($('texte').value.trim());
  $('octets').textContent = n ? (n <= max ? T('reste ', '') + (max - n) + T('', ' left') : T('trop long de ', 'too long by ') + (n - max)) : '';
  $('octets').className = 'compte-octets' + (n > max ? ' trop' : '');
  $('envoyer').disabled = !n || n > max;
}
$('texte').addEventListener('input', compter);
$('ecrire').onsubmit = function (ev) {
  ev.preventDefault();
  var v = $('dest').value, corps = { texte: $('texte').value.trim(), canal: 0, a: '' };
  if (v.slice(0, 2) === 'c:') corps.canal = +v.slice(2); else corps.a = v.slice(2);
  $('envoyer').disabled = true; $('erreur').textContent = ''; $('erreur').className = 'erreur';
  fetch('/admin-api/radio/envoyer', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(corps) })
    .then(function (r) { return r.json().then(function (d) { return { ok: r.ok, d: d }; }); })
    .then(function (r) {
      if (!r.ok) { $('erreur').textContent = TE(r.d.erreur) || T('Erreur.', 'Error.'); compter(); return; }
      $('texte').value = ''; compter();
      dire('erreur', true, T('Message mis dans la file : il part dans quelques secondes.', 'Message queued: it leaves in a few seconds.'));
      setTimeout(function () { $('erreur').textContent = ''; }, 6000);
      setTimeout(charger, 4000); setTimeout(charger, 20000);
    })
    .catch(function () { $('erreur').textContent = T('La station ne répond pas.', 'The station does not respond.'); compter(); });
};

// ----- Historique (version complete)
$('form-histo').onsubmit = function (ev) {
  ev.preventDefault();
  var mot = $('h-mot').value.trim().toLowerCase(), z = $('histo');
  z.innerHTML = ''; z.appendChild(el('p', 'rien', T('Recherche…', 'Searching…')));
  api('/mesh/historique?quoi=paquets&limite=5000&depuis=' + (maintenant() - $('h-duree').value * 86400)).then(function (r) {
    var l = r.donnees.filter(function (p) { return p.resume && p.resume.texte; }).filter(function (p) {
      return !mot || (p.resume.texte + ' ' + (p.nom || '') + ' ' + (p.de || '')).toLowerCase().indexOf(mot) >= 0;
    });
    z.innerHTML = '';
    if (!l.length) { z.appendChild(el('p', 'rien', T('Rien trouvé.', 'Nothing found.'))); return; }
    l.slice(0, 500).forEach(function (p) {
      z.appendChild(ligneMessage({ sens: p.sens, nom: p.nom || p.de || '?', heure: p.heure, texte: p.resume.texte, canal: p.canal,
                                   direct: p.a && p.a !== '^all' && p.a.charAt(0) === '!', a: p.a, snr: p.snr, rssi: p.rssi, sauts: p.sauts }, false));
    });
    if (l.length > 500) z.appendChild(el('p', 'note', T('500 premiers sur ', 'First 500 of ') + l.length));
  }).catch(function (e) { z.innerHTML = ''; z.appendChild(el('p', 'erreur', e.message)); });
};

function charger() {
  return chargerStation().then(function (d) {
    journal = d.journal || [];
    afficherEcrire(); afficherJournal();
  }).catch(function () {});
}
charger().then(function () { if (demande.get('a')) { choisirDest('n:' + demande.get('a'), demande.get('nom') || demande.get('a')); $('texte').focus(); } });
setInterval(charger, 15000);
</script>
</body>
</html>
