# Prometheus Station - LA table des dossiers : qui en est proprietaire et qui peut y ecrire (27/11/2026).
# Installee dans /etc/tmpfiles.d/prometheus.conf. Le systeme l'applique a chaque demarrage, et chaque etape
# d'installation la reapplique a la fin (commun.sh) : l'ordre des etapes ne compte plus, et un droit abime se
# repare tout seul. Avant, ces droits etaient ecrits dans 5 fichiers qui se contredisaient (relancer l'etape 2
# cassait les boutons, relancer l'etape 3 desarmait le garde-fou de la radio).
# Un droit a changer ? Ici seulement.
#
# d = cree le dossier s'il manque et remet son mode et son proprietaire (pas son contenu)
# Z = remet le proprietaire de tout le contenu (mode « - » : les modes des fichiers ne changent pas)
#
# Type Chemin                                  Mode  Proprietaire Groupe   Age

# En memoire, vide a chaque demarrage : etat de la batterie, extinction, tension, ecran
d /run/prometheus                              0755  prometheus   prometheus -

# Les donnees de la station (services sous l'utilisateur « prometheus »)
d /srv/prometheus                              0755  prometheus   prometheus -
d /srv/prometheus/encyclopedies                0755  prometheus   prometheus -
d /srv/prometheus/bibliotheque                 0755  prometheus   prometheus -
# Mot de passe, sessions, choix (couleurs, mode sobre) : la station seulement
d /srv/prometheus/.admin                       0700  prometheus   prometheus -
Z /srv/prometheus/.admin                       -     prometheus   prometheus -
d /srv/prometheus/messages                     0755  prometheus   prometheus -
Z /srv/prometheus/messages                     -     prometheus   prometheus -
d /srv/prometheus/panneau                      0755  prometheus   prometheus -
Z /srv/prometheus/panneau                      -     prometheus   prometheus -
d /srv/prometheus/communaute                   0755  prometheus   prometheus -
Z /srv/prometheus/communaute                   -     prometheus   prometheus -

# Ecrits par nginx (www-data) : fichiers envoyes depuis la page Ajouter, sauvegarde a remettre (mots de passe wifi)
d /srv/prometheus/depot                        0755  www-data     www-data   -
d /srv/prometheus/.envoi                       0755  www-data     www-data   -
d /srv/prometheus/restauration                 0700  www-data     www-data   -
# Les ordres des boutons (nginx) et du garde-fou de la radio (groupe prometheus), executes par prometheus-commande
d /srv/prometheus/commande                     2775  www-data     prometheus -
# Ordres radio arrives pendant qu'une autre operation radio tourne : repris a sa fin (jamais dans « commande »,
# que surveille le systeme : un dossier dedans le ferait tourner sans fin)
d /srv/prometheus/commande-attente             0700  root         root       -
# Resultat de chaque ordre numerote, lu par la page (servi par nginx a l'administrateur connecte, comme etat.json)
d /var/www/prometheus/ajouter/resultats        0755  root         root       -
# Sauvegardes des reglages : telechargees par l'administrateur connecte (nginx)
d /srv/prometheus/sauvegardes                  0750  root         www-data   -

# La radio (prometheus-radio, prometheus-admin, outil radio en root)
d /srv/prometheus/radio                        0755  prometheus   prometheus -
d /srv/prometheus/radio/a-envoyer              0755  prometheus   prometheus -
d /srv/prometheus/radio/partis                 0755  prometheus   prometheus -
d /srv/prometheus/radio/recus                  0755  prometheus   prometheus -
# Ordres et reponses de la section Mesh : ils peuvent porter des cles (reglages lus, canaux) -> station seulement
d /srv/prometheus/radio/ordres                 0700  prometheus   prometheus -
d /srv/prometheus/radio/reponses               0700  prometheus   prometheus -
d /srv/prometheus/radio/mesh-sauvegardes       0700  prometheus   prometheus -
d /srv/prometheus/radio/logiciels              0755  root         root       -
d /srv/prometheus/radio/sauvegardes            0700  root         root       -

# Les pages (root), sauf la liste des livres et les couleurs, ecrites par les services
d /var/www/prometheus/bibliotheque             0755  prometheus   prometheus -
