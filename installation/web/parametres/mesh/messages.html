<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48">
<title>Messages · Mesh</title>
<link rel="stylesheet" href="/style.css">
<link rel="stylesheet" href="/theme.css">
<link rel="stylesheet" href="/communaute.css">
<link rel="stylesheet" href="mesh.css">
<script src="/langue.js"></script>
<script src="/commun.js"></script>
<script src="mesh.js"></script>
</head>
<body>
<main>
  <div id="entete"></div>
  <!-- Ecrire : a tout un canal, ou a une seule radio (message direct, avec accuse de reception) -->
  <form class="form" id="ecrire" hidden>
    <label for="dest" data-en="To">À</label>
    <select class="champ" id="dest"></select>
    <textarea class="champ" id="texte" rows="2" placeholder="Votre message" data-en-ph="Your message"></textarea>
    <div class="bas-form"><span class="compte-octets" id="octets"></span><button class="bouton" id="envoyer" disabled data-en="Send">Envoyer</button></div>
    <p class="erreur" id="erreur"></p>
  </form>
  <div class="puces" id="canaux"></div>
  <div class="lignes" id="journal"></div>
  <div class="complet-seul">
    <h2 class="avec-aide"><span data-en="History">Historique</span><button class="aide-bouton" type="button" data-aide="aide-histo">?</button></h2>
    <p class="aide" id="aide-histo" hidden data-en="Every text message heard or sent by the station, kept as long as set in Settings > Mesh (90 days at first). Search by word or by radio.">Tous les messages texte entendus ou envoyés par la station, gardés aussi longtemps que réglé dans Paramètres > Mesh (90 jours au départ). Cherchez par mot ou par radio.</p>
    <form class="form" id="form-histo"><div class="deux"><input class="champ" id="h-mot" placeholder="Mot ou radio" data-en-ph="Word or radio" autocomplete="off">
      <select class="champ" id="h-duree"><option value="1">24 h</option><option value="7" selected>7 jours</option><option value="30">30 jours</option><option value="365">tout</option></select></div>
      <button class="bouton secondaire" data-en="Search">Chercher</button></form>
    <div class="lignes" id="histo"></div>
  </div>
</main>
<script>
// Messages radio : tous les canaux et les messages directs, recus et emis (plan radio R1-R2, section Mesh).
entete('messages', 'Messages', 'Messages');
aides();
var filtre = 'tout', journal = [];
var demande = new URLSearchParams(location.search);

function nomCanal(i) {
  var c = ((station.details || {}).canaux || []).filter(function (x) { return x.index === i; })[0];
  return c ? c.nom : T('Canal ', 'Channel ') + i;
}
function afficherJournal() {
  var j = journal.slice().reverse(), canaux = (station.details || {}).canaux || [], vus = {};
  canaux.forEach(function (c) { vus[c.index] = true; });
  j.forEach(function (m) { if (!m.direct) vus[m.canal || 0] = true; });
  var choix = [['tout', T('Tout', 'All')]];
  Object.keys(vus).sort().forEach(function (i) { choix.push(['c' + i, nomCanal(+i)]); });
  if (j.some(function (m) { return m.direct; })) choix.push(['direct', T('Messages directs', 'Direct messages')]);
  if (!choix.some(function (c) { return c[0] === filtre; })) filtre = 'tout';
  var zc = $('canaux'); zc.innerHTML = '';
  choix.forEach(function (c) {
    var b = el('button', 'puce' + (c[0] === filtre ? ' choisie' : ''), c[1]);
    b.onclick = function () { filtre = c[0]; afficherJournal(); };
    zc.appendChild(b);
  });
  var liste = j.filter(function (m) { return filtre === 'tout' || (filtre === 'direct' ? m.direct : !m.direct && 'c' + (m.canal || 0) === filtre); });
  var zone = $('journal'); zone.innerHTML = '';
  if (!liste.length) { zone.appendChild(el('p', 'rien', T('Aucun message radio pour l’instant.', 'No radio message yet.'))); return; }
  liste.forEach(function (m) { zone.appendChild(ligneMessage(m, true)); });
}
function ligneMessage(m, repondre) {
  var c = el('div', 'ligne-m'), haut = el('div', 'haut');
  var qui = m.sens === 'emis' ? T('La station', 'The station') + (m.direct ? ' → ' + (m.nom_a || m.a) : '') : m.nom;
  haut.appendChild(el('b', '', qui));
  haut.appendChild(el('span', 'heure', heure(m.heure)));
  if (m.direct) haut.appendChild(el('span', 'mot', T('direct', 'direct')));
  else if (filtre === 'tout' && m.canal !== undefined && m.canal !== null) haut.appendChild(el('span', 'mot', nomCanal(m.canal || 0)));
  if (m.sens === 'emis') haut.appendChild(el('span', 'mot', T('envoyé', 'sent')));
  if (m.sens === 'emis' && m.statut) {
    var ST = { attente: [T('en attente de réponse', 'waiting for reply'), ''], remis: [T('remis', 'delivered'), 'bien'], echec: [T('non remis', 'not delivered'), 'alerte'] };
    var st = ST[m.statut] || [m.statut, ''];
    haut.appendChild(el('span', 'statut ' + st[1], st[0] + (m.statut === 'echec' && m.raison && MODE === 'complet' ? ' (' + m.raison + ')' : '')));
  }
  if (repondre && m.sens === 'recu' && m.de && station.etat.active) {
    var rep = el('button', 'lien', T('Répondre', 'Reply')); rep.type = 'button'; rep.style.marginLeft = 'auto';
    rep.onclick = function () { choisirDest('n:' + m.de, m.nom); $('texte').focus(); scrollTo(0, $('ecrire').offsetTop - 20); };
    haut.appendChild(rep);
  }
  c.appendChild(haut);
  c.appendChild(el('div', 'texte', m.texte));
  var sig = [];
  if (typeof m.snr === 'number') sig.push('SNR ' + virgule(m.snr) + ' dB');
  if (m.rssi) sig.push('RSSI ' + m.rssi + ' dBm');
  var s = sauts(m.sauts); if (s) sig.push(s);
  if (sig.length) {
    var ls = el('div', 'signal', sig.join(' · '));
    c.appendChild(ls);
    if (m.chemin && m.sauts > 0 && (station.mesh || {}).trajet) boutonTrajet(c, ls, m);
  }
  return c;
}

// ----- Trajet d'un message MeshCore (Parametres > Mesh > Trajet des messages) : les relais, ou ils sont.
// La station retrouve les relais (/mesh/trajet, radio_trajet.py) ; ici, seulement l'affichage. Un panneau
// ouvert le reste quand la liste se redessine (toutes les 15 s).
var trajetsOuverts = {}, trajetsLus = {};
function boutonTrajet(ligne, ls, m) {
  // cle : le chemin (meme chemin = meme trajet, lu une seule fois) ; ici : CE message (deux messages venus par le
  // meme chemin ne s'ouvrent pas ensemble)
  var cle = m.sauts + ':' + m.chemin, ici = m.heure + '@' + cle, b = el('button', 'plus');
  b.type = 'button';
  var zone = el('div', 'trajet'); zone.hidden = true;
  function montrer(ouvert) {
    b.textContent = ouvert ? T('− trajet', '− route') : T('+ trajet', '+ route');
    b.setAttribute('aria-expanded', ouvert ? 'true' : 'false');
    zone.hidden = !ouvert;
    if (ouvert) remplirTrajet(zone, cle, m);
  }
  b.onclick = function () { trajetsOuverts[ici] = !trajetsOuverts[ici]; montrer(trajetsOuverts[ici]); };
  ls.appendChild(b); ligne.appendChild(zone);
  montrer(!!trajetsOuverts[ici]);
}
function remplirTrajet(zone, cle, m) {
  if (trajetsLus[cle]) { dessinerTrajet(zone, trajetsLus[cle], m); return; }
  zone.innerHTML = ''; zone.appendChild(el('p', 'note', T('Recherche des relais…', 'Looking up the relays…')));
  api('/mesh/trajet?sauts=' + m.sauts + '&chemin=' + encodeURIComponent(m.chemin)).then(function (r) {
    trajetsLus[cle] = r; dessinerTrajet(zone, r, m);
  }).catch(function (e) { zone.innerHTML = ''; zone.appendChild(el('p', 'erreur', e.message)); });
}
function svg(tag, attributs, parent) {
  var e = document.createElementNS('http://www.w3.org/2000/svg', tag);
  Object.keys(attributs).forEach(function (k) { e.setAttribute(k, attributs[k]); });
  if (parent) parent.appendChild(e);
  return e;
}
// Projection de Mercator (comme les cartes du web) : x, y dans [0, 1]
function mercator(lat, lon) {
  var s = Math.sin(Math.max(-85, Math.min(85, lat)) * Math.PI / 180);
  return [(lon + 180) / 360, 0.5 - Math.log((1 + s) / (1 - s)) / (4 * Math.PI)];
}
function latDeY(y) { return Math.atan(Math.sinh(Math.PI * (1 - 2 * y))) * 180 / Math.PI; }
// Carte du trajet : fond hors ligne dessine par la station (Natural Earth : /mesh/fond), puis les relais situes,
// relies dans l'ordre (pointilles la ou des relais manquent). Sans fond telecharge : le trajet seul.
function carteTrajet(pts, cache) {
  var L = 300, H = 300, MARGE = 36;
  var px = pts.map(function (q) { return mercator(q.lat, q.lon); });
  var x0 = Math.min.apply(0, px.map(function (q) { return q[0]; })), x1 = Math.max.apply(0, px.map(function (q) { return q[0]; }));
  var y0 = Math.min.apply(0, px.map(function (q) { return q[1]; })), y1 = Math.max.apply(0, px.map(function (q) { return q[1]; }));
  var mini = 30 / 40075 / Math.cos(pts[0].lat * Math.PI / 180);      // au moins 30 km de large
  var ech = (L - 2 * MARGE) / Math.max(x1 - x0, y1 - y0, mini);       // pixels par unite de Mercator
  var ox = (x0 + x1) / 2 - L / 2 / ech, oy = (y0 + y1) / 2 - H / 2 / ech;
  var xy = function (lat, lon) { var m = mercator(lat, lon); return [(m[0] - ox) * ech, (m[1] - oy) * ech]; };
  var c = svg('svg', { viewBox: '0 0 ' + L + ' ' + H, role: 'img', 'aria-label': T('Carte du trajet', 'Map of the route') });
  var fond = svg('g', { 'class': 'fond' }, c);
  // Le cadre en degres, pour demander le fond a la station ; tol = un pixel en degres
  var cadre = { o: ox * 360 - 180, e: (ox + L / ech) * 360 - 180, n: latDeY(oy), s: latDeY(oy + H / ech) };
  var tol = (cadre.e - cadre.o) / L * Math.cos(pts[0].lat * Math.PI / 180);
  var dessinerFond = function (f) {
    if (!f || f.absent || f.erreur) {
      if (f && f.absent) svg('text', { x: 296, y: 14, 'text-anchor': 'end', 'class': 'attribution' }, fond).textContent = T('fond de carte pas encore téléchargé', 'map background not downloaded yet');
      return;
    }
    // La mer, puis les terres et les lacs (carreaux remplis), puis les traits, puis les villes
    svg('rect', { x: 0, y: 0, width: L, height: H, 'class': 'mer' }, fond);
    var chemin = function (ligne) {
      return ligne.map(function (p, i) { var a = xy(p[1], p[0]); return (i ? 'L' : 'M') + a[0].toFixed(1) + ' ' + a[1].toFixed(1); }).join('');
    };
    ['terres', 'lacs'].forEach(function (couche) {
      (f[couche] || []).forEach(function (anneaux) {
        svg('path', { d: anneaux.map(function (a) { return chemin(a) + 'Z'; }).join(''), 'class': 'c-' + couche, 'fill-rule': 'evenodd' }, fond);
      });
    });
    ['regions', 'frontieres', 'fleuves', 'routes', 'cotes'].forEach(function (couche) {
      (f[couche] || []).forEach(function (ligne) {
        svg('path', { d: chemin(ligne), 'class': 'c-' + couche, fill: 'none' }, fond);   // jamais rempli, meme avec une vieille feuille de style
      });
    });
    // Villes : plus grosses et plus marquees selon le nombre d'habitants ; les plus grandes d'abord
    (f.villes || []).forEach(function (v) {
      var a = xy(v.lat, v.lon), n = v.habitants || 0;
      if (a[0] < 2 || a[0] > L - 2 || a[1] < 2 || a[1] > H - 2) return;
      var taille = n >= 200000 ? 'grande' : n >= 30000 ? 'moyenne' : 'petite';
      svg('circle', { cx: a[0], cy: a[1], r: taille === 'grande' ? 2.6 : taille === 'moyenne' ? 2 : 1.4, 'class': 'ville' }, fond);
      // Le nom part vers la gauche s'il depasserait du bord droit (largeur estimee d'apres sa taille de lettres)
      var droite = a[0] + 4 + v.nom.length * { grande: 6.4, moyenne: 5.3, petite: 4.6 }[taille] > L - 4;
      svg('text', { x: droite ? a[0] - 4 : a[0] + 4, y: a[1] - 3, 'text-anchor': droite ? 'end' : 'start', 'class': 'nom-ville ' + taille }, fond).textContent = v.nom;
    });
    svg('text', { x: L - 4, y: H - 4, 'text-anchor': 'end', 'class': 'attribution' }, fond).textContent = 'Natural Earth · GeoNames';
  };
  if (cache.fond) dessinerFond(cache.fond);
  else api('/mesh/fond?o=' + cadre.o.toFixed(4) + '&s=' + cadre.s.toFixed(4) + '&e=' + cadre.e.toFixed(4) + '&n=' + cadre.n.toFixed(4) + '&tol=' + tol.toFixed(5))
    .then(function (f) { cache.fond = f; dessinerFond(f); }).catch(function () {});
  for (var j = 1; j < pts.length; j++) {
    var a = xy(pts[j - 1].lat, pts[j - 1].lon), b = xy(pts[j].lat, pts[j].lon);
    var trou = pts[j].i - pts[j - 1].i > 1;
    svg('line', { x1: a[0], y1: a[1], x2: b[0], y2: b[1], 'class': 'lisere' }, c);     // bord clair : le trajet se detache du fond
    svg('line', { x1: a[0], y1: a[1], x2: b[0], y2: b[1], 'class': trou ? 'trou' : 'ligne-trajet' }, c);
  }
  pts.forEach(function (q, j) {
    var a = xy(q.lat, q.lon), dernier = j === pts.length - 1;
    var rond = svg('circle', { cx: a[0], cy: a[1], r: dernier ? 4.5 : 3, 'class': 'relais' + (dernier ? ' dernier' : '') }, c);
    svg('title', {}, rond).textContent = (q.i + 1) + '. ' + q.nom;
    if (j === 0 || dernier) {
      // Le nom ne doit pas sortir de la carte : cale a gauche ou a droite pres d'un bord
      var cote = a[0] < 90 ? 'start' : a[0] > 210 ? 'end' : 'middle';
      var t = svg('text', { x: cote === 'start' ? Math.max(4, a[0] - 6) : cote === 'end' ? Math.min(296, a[0] + 6) : a[0],
                            y: a[1] + (dernier ? 16 : -9), 'text-anchor': cote, 'class': 'nom-relais' }, c);
      t.textContent = q.nom.length > 22 ? q.nom.slice(0, 21) + '…' : q.nom;
    }
  });
  // Echelle : un nombre rond de kilometres, au plus 80 px (Mercator : l'echelle depend de la latitude)
  var kmParPx = 40075 * Math.cos(pts[0].lat * Math.PI / 180) / ech;
  var pas = [0.5, 1, 2, 5, 10, 20, 50, 100, 200, 500, 1000].filter(function (x) { return x / kmParPx <= 80; }).pop() || 0.5;
  svg('line', { x1: 14, y1: 286, x2: 14 + pas / kmParPx, y2: 286, 'class': 'echelle' }, c);
  svg('text', { x: 14, y: 281, 'class': 'nom-relais' }, c).textContent = virgule(pas, pas < 1 ? 1 : 0) + ' km';
  return c;
}
function dessinerTrajet(zone, r, m) {
  zone.innerHTML = '';
  var et = r.etapes || [], titre = el('div', 'titre');
  titre.appendChild(el('b', '', T('Trajet du message', 'Route of the message')));
  var resume = [et.length + T(' relais', et.length > 1 ? ' relays' : ' relay')];
  if (r.places < et.length) resume.push(r.places + T(' situés', ' located'));
  if (r.places > 1) resume.push((r.places < et.length ? T('au moins ', 'at least ') : '') + r.km + ' km');
  titre.appendChild(el('span', '', resume.join(' · ')));
  var q = el('button', 'aide-bouton', '?'); q.type = 'button'; q.setAttribute('aria-expanded', 'false');
  titre.appendChild(q);
  zone.appendChild(titre);
  var aide = el('p', 'aide', T('Chaque relais ajoute au message le début de son identifiant. La station le retrouve parmi les radios qu’elle a entendues, puis dans la liste publique des relais MeshCore.',
    'Each relay adds the start of its identifier to the message. The station finds it among the radios it has heard, then in the public list of MeshCore relays.'));
  var ouvrirAide = function (ouvert) { aide.hidden = !ouvert; q.setAttribute('aria-expanded', ouvert ? 'true' : 'false'); };
  zone.appendChild(aide); ouvrirAide(!!r.aideOuverte);
  q.onclick = function () { r.aideOuverte = aide.hidden; ouvrirAide(r.aideOuverte); };
  // Carte : fond hors ligne, relais situes (voir carteTrajet)
  var pts = [];
  et.forEach(function (e, i) { if (typeof e.lat === 'number') pts.push({ lat: e.lat, lon: e.lon, i: i, nom: e.nom }); });
  if (pts.length) zone.appendChild(carteTrajet(pts, r));
  // Les etapes : les relais inconnus qui se suivent sont regroupes
  var ol = el('ol', 'etapes'), i = 0;
  while (i < et.length) {
    var e = et[i], li = el('li');
    if (!e.nom) {
      var fin = i; while (fin + 1 < et.length && !et[fin + 1].nom) fin++;
      var nb = fin - i + 1;
      li.appendChild(el('span', 'n', nb > 1 ? (i + 1) + '–' + (fin + 1) : String(i + 1)));
      var t = el('span', 'inconnu', nb > 1 ? nb + T(' relais inconnus', ' unknown relays') : T('relais inconnu', 'unknown relay'));
      t.appendChild(el('span', 'ident', et.slice(i, fin + 1).map(function (x) { return x.id; }).join(' ')));
      li.appendChild(t); li.appendChild(el('span', 'km', ''));
      i = fin + 1;
    } else {
      li.appendChild(el('span', 'n', String(i + 1)));
      var nomz = el('span'); nomz.appendChild(el('b', '', e.nom));
      if (e.lat === null) nomz.appendChild(el('span', 'ident', T('position inconnue', 'position unknown')));
      if (e.certitude === 'probable') nomz.appendChild(el('span', 'mot', T('probable', 'likely')));
      if (e.source === 'public') nomz.appendChild(el('span', 'ident', T('liste publique', 'public list')));
      li.appendChild(nomz);
      li.appendChild(el('span', 'km', typeof e.km === 'number' ? '+' + Math.round(e.km) + ' km' : ''));
      if (i === et.length - 1) li.className = 'fin';
      i++;
    }
    ol.appendChild(li);
  }
  var arrivee = el('li', 'fin');
  arrivee.appendChild(el('span', 'n', '→')); var st = el('span'); st.appendChild(el('b', '', T('La station', 'The station'))); arrivee.appendChild(st);
  arrivee.appendChild(el('span', 'km', typeof m.snr === 'number' ? 'SNR ' + virgule(m.snr) + ' dB' : ''));
  ol.appendChild(arrivee);
  zone.appendChild(ol);
  // Pied : le signal, et la liste publique (date, ou bouton pour la telecharger)
  var note = el('p', 'note');
  note.appendChild(el('span', '', T('Le signal (SNR) ne concerne que le dernier saut, du dernier relais à la station.', 'The signal (SNR) only covers the last hop, from the last relay to the station.')));
  var l = r.liste || {};
  if (l.quand) note.appendChild(el('span', '', T('Liste publique du ', 'Public list of ') + dateCourte(l.quand) + ' · ' + l.nombre + T(' relais', ' relays')));
  if (!l.quand || Date.now() / 1000 - l.quand > 7 * 86400) {
    var tel = el('button', 'lien', l.quand ? T('Mettre à jour la liste publique (internet)', 'Update the public list (internet)')
      : T('Télécharger la liste publique des relais (internet)', 'Download the public list of relays (internet)'));
    tel.type = 'button';
    tel.onclick = function () {
      tel.disabled = true; tel.textContent = T('Téléchargement lancé : environ une minute…', 'Download started: about a minute…');
      commander('radio-relais', '').then(function () {
        setTimeout(function () { trajetsLus = {}; afficherJournal(); }, 75000);
      });
    };
    note.appendChild(tel);
  }
  zone.appendChild(note);
}

// ----- Ecrire
function choisirDest(valeur, nom) {
  var s = $('dest');
  if (![].some.call(s.options, function (o) { return o.value === valeur; })) {
    var o = el('option', '', nom + T(' (message direct)', ' (direct message)')); o.value = valeur; s.appendChild(o);
  }
  s.value = valeur;
}
function afficherEcrire() {
  $('ecrire').hidden = !station.etat.active;
  var d = station.details || {}, s = $('dest'), avant = s.value, choix = [];
  (d.canaux || [{ index: 0, nom: T('canal principal', 'primary channel') }]).forEach(function (c) { choix.push(['c:' + c.index, T('Tout le monde · ', 'Everyone · ') + c.nom]); });
  (d.noeuds || []).forEach(function (n) { choix.push(['n:' + n.id, n.nom + T(' (message direct)', ' (direct message)')]); });
  var cle = JSON.stringify(choix);
  if (s.dataset.cle !== cle) {
    s.dataset.cle = cle; s.innerHTML = '';
    choix.forEach(function (c) { var o = el('option', '', c[1]); o.value = c[0]; s.appendChild(o); });
    if (avant) choisirDest(avant, avant.slice(2));
  }
  compter();
}
function compter() {
  var max = (station && station.etat.max) || 228, n = octets($('texte').value.trim());
  $('octets').textContent = n ? (n <= max ? T('reste ', '') + (max - n) + T('', ' left') : T('trop long de ', 'too long by ') + (n - max)) : '';
  $('octets').className = 'compte-octets' + (n > max ? ' trop' : '');
  $('envoyer').disabled = !n || n > max;
}
$('texte').addEventListener('input', compter);
$('ecrire').onsubmit = function (ev) {
  ev.preventDefault();
  var v = $('dest').value, corps = { texte: $('texte').value.trim(), canal: 0, a: '' };
  if (v.slice(0, 2) === 'c:') corps.canal = +v.slice(2); else corps.a = v.slice(2);
  $('envoyer').disabled = true; $('erreur').textContent = ''; $('erreur').className = 'erreur';
  envoyer('/admin-api/radio/envoyer', corps)
    .then(function (r) {
      if (!r.ok) { $('erreur').textContent = r.erreur; compter(); return; }
      $('texte').value = ''; compter();
      dire('erreur', true, T('Message mis dans la file : il part dans quelques secondes.', 'Message queued: it leaves in a few seconds.'));
      setTimeout(function () { $('erreur').textContent = ''; }, 6000);
      setTimeout(charger, 4000); setTimeout(charger, 20000);
    });
};

// ----- Historique (version complete)
$('form-histo').onsubmit = function (ev) {
  ev.preventDefault();
  var mot = $('h-mot').value.trim().toLowerCase(), z = $('histo');
  z.innerHTML = ''; z.appendChild(el('p', 'rien', T('Recherche…', 'Searching…')));
  api('/mesh/historique?quoi=paquets&limite=5000&depuis=' + (maintenant() - $('h-duree').value * 86400)).then(function (r) {
    var l = r.donnees.filter(function (p) { return p.resume && p.resume.texte; }).filter(function (p) {
      return !mot || (p.resume.texte + ' ' + (p.nom || '') + ' ' + (p.de || '')).toLowerCase().indexOf(mot) >= 0;
    });
    z.innerHTML = '';
    if (!l.length) { z.appendChild(el('p', 'rien', T('Rien trouvé.', 'Nothing found.'))); return; }
    l.slice(0, 500).forEach(function (p) {
      z.appendChild(ligneMessage({ sens: p.sens, nom: p.nom || p.de || '?', heure: p.heure, texte: p.resume.texte, canal: p.canal,
                                   direct: p.a && p.a !== '^all' && p.a.charAt(0) === '!', a: p.a, snr: p.snr, rssi: p.rssi, sauts: p.sauts }, false));
    });
    if (l.length > 500) z.appendChild(el('p', 'note', T('500 premiers sur ', 'First 500 of ') + l.length));
  }).catch(function (e) { z.innerHTML = ''; z.appendChild(el('p', 'erreur', e.message)); });
};

function charger() {
  return chargerStation().then(function (d) {
    journal = d.journal || [];
    afficherEcrire(); afficherJournal();
  }).catch(function () {});
}
charger().then(function () { if (demande.get('a')) { choisirDest('n:' + demande.get('a'), demande.get('nom') || demande.get('a')); $('texte').focus(); } });
setInterval(charger, 15000);
</script>
