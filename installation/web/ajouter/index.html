<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48">
<title data-en="Add files">Ajouter des fichiers</title>
<link rel="stylesheet" href="/style.css">
<link rel="stylesheet" href="/theme.css">
<script src="/langue.js"></script>
<script src="/commun.js"></script>
<script src="/annonce.js"></script>
<script>
// Bouton « retour » : le navigateur reaffiche une page gardee en memoire ; on reprend les couleurs du moment
addEventListener('pageshow', function (e) { if (e.persisted) document.querySelector('link[href^="/theme.css"]').href = '/theme.css?' + Date.now(); });
</script>
</head>
<body>
<main>
  <a class="retour" href="/parametres/" data-en="← Settings">← Paramètres</a>
  <h1 data-en="Add files">Ajouter des fichiers</h1>
  <label class="depot" id="depot">
    <strong data-en="Drop your files here">Glissez vos fichiers ici</strong><br>
    <span class="sous" data-en="or tap to choose them — EPUB or PDF books, ZIM encyclopedias">ou touchez pour les choisir — livres EPUB ou PDF, encyclopédies ZIM</span>
    <input type="file" id="choix" multiple hidden accept=".epub,.pdf,.zim">
  </label>
  <div id="doublons"></div>
  <ul class="envois" id="envois"></ul>
</main>
<script>
var acceptes = /\.(epub|pdf|zim)$/i;

// ----- Livres en double (meme contenu, octet pour octet) : proposer de supprimer le plus recent ou de garder les deux
// Tailles : taille() de /commun.js (1 Mo = 1 000 000 octets, comme partout sur la station)
function ordre(nom, contenu) { return commander(nom + '-' + Date.now(), contenu); }   // numerote (/commun.js)
function doublons() {
  return lire('/ajouter/doublons.json').catch(function () { return { groupes: [] }; })
    .then(function (d) { afficherDoublons(d.groupes || []); });
}
function afficherDoublons(groupes) {
  var zone = document.getElementById('doublons');
  zone.innerHTML = '';
  groupes.forEach(function (g) {
    var c = document.createElement('div'); c.className = 'doublon';
    var t = document.createElement('p'); t.className = 'doublon-titre';
    t.textContent = T('Livre en double', 'Duplicate book');
    var p = document.createElement('p');
    p.textContent = (g.doublons.length > 1 ? g.doublons.map(function (n) { return '« ' + n + ' »'; }).join(T(' et ', ' and ')) + T(' sont identiques', ' are identical')
      : '« ' + g.doublons[0] + ' »' + T(' est identique', ' is identical')) + T(' à « ', ' to “') + g.garder + T(' », déjà dans la bibliothèque (même contenu, ', '”, already in the library (same content, ') + taille(g.taille) + ').';
    var boutons = document.createElement('div'); boutons.className = 'doublon-boutons';
    var sup = document.createElement('button'); sup.className = 'bouton';
    sup.textContent = g.doublons.length > 1 ? T('Supprimer les doublons', 'Delete the duplicates') : T('Supprimer le doublon', 'Delete the duplicate');
    var garder = document.createElement('button'); garder.className = 'bouton secondaire';
    garder.textContent = T('Garder les deux', 'Keep both');
    // En deux temps, comme toute suppression
    deuxTemps(sup, { texte: T('Toucher encore pour supprimer', 'Tap again to delete'), action: function () {
      sup.disabled = garder.disabled = true; sup.textContent = T('Suppression…', 'Deleting…');
      Promise.all(g.doublons.map(function (n) { return ordre('supprimer', n); })).then(attendre, attendre);
    } });
    garder.onclick = function () {
      sup.disabled = garder.disabled = true;
      ordre('garder-doublon', g.empreinte).then(attendre, attendre);
    };
    boutons.appendChild(sup); boutons.appendChild(garder);
    c.appendChild(t); c.appendChild(p); c.appendChild(boutons);
    zone.appendChild(c);
  });
}
// Apres un ordre ou un envoi : la station range puis recalcule ; on relit quelques fois
function attendre() { [2000, 5000, 10000, 20000, 40000].forEach(function (ms) { setTimeout(doublons, ms); }); }
doublons();

// Deposer un fichier sur la station (XMLHttpRequest : lui seul donne l'avancement de l'envoi)
function deposer(f) {
  var li = document.createElement('li');
  var nom = document.createElement('div');
  nom.className = 'nom-envoi';
  nom.textContent = f.name;
  var barre = document.createElement('div');
  barre.className = 'jauge';
  var plein = document.createElement('span');
  barre.appendChild(plein);
  var etat = document.createElement('div');
  etat.className = 'etat-envoi';
  li.appendChild(nom); li.appendChild(barre); li.appendChild(etat);
  document.getElementById('envois').appendChild(li);

  if (!acceptes.test(f.name)) {
    barre.remove();
    etat.textContent = T('Refusé : seuls les fichiers EPUB, PDF et ZIM sont acceptés.', 'Refused: only EPUB, PDF and ZIM files are accepted.');
    return;
  }
  // Pourcentage en gras, puis ce qui est parti sur le total (Mo)
  function avance(fait, total) {
    var pc = total ? Math.floor(fait / total * 100) : 0;
    plein.style.width = pc + '%';
    etat.innerHTML = '';
    var b = document.createElement('b'); b.textContent = pc + ' %';
    etat.appendChild(b);
    etat.appendChild(document.createTextNode(' · ' + taille(fait) + T(' sur ', ' of ') + taille(total)));
  }
  avance(0, f.size);
  var x = new XMLHttpRequest();
  x.open('PUT', '/ajouter/depot/' + encodeURIComponent(f.name));
  x.upload.onprogress = function (e) { if (e.lengthComputable) avance(e.loaded, e.total); };
  x.onload = function () {
    var ok = x.status >= 200 && x.status < 300;
    plein.style.width = '100%';
    barre.classList.add(ok ? 'fini' : 'echec');
    etat.textContent = ok
      ? T('Reçu (', 'Received (') + taille(f.size) + T('). Il sera rangé dans un instant.', '). It will be filed in a moment.')
      : T('Échec de l’envoi (erreur ', 'Upload failed (error ') + x.status + ').';
    if (ok) attendre();
  };
  x.onerror = function () {
    barre.classList.add('echec');
    etat.textContent = T('Échec de l’envoi : la connexion a été coupée.', 'Upload failed: the connection was lost.');
  };
  x.send(f);
}

var depot = document.getElementById('depot');
document.getElementById('choix').addEventListener('change', function (e) {
  Array.prototype.forEach.call(e.target.files, deposer);
  e.target.value = '';
});
['dragenter', 'dragover'].forEach(function (t) {
  depot.addEventListener(t, function (e) { e.preventDefault(); depot.classList.add('survol'); });
});
['dragleave', 'drop'].forEach(function (t) {
  depot.addEventListener(t, function (e) { e.preventDefault(); depot.classList.remove('survol'); });
});
depot.addEventListener('drop', function (e) { Array.prototype.forEach.call(e.dataTransfer.files, deposer); });
</script>
</body>
</html>
