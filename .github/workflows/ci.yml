name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shellcheck:
    name: Shell scripts (shellcheck)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      SHELLCHECK_VERSION: v0.10.0
      SHELLCHECK_SHA256: 6c881ab0698e4e6ea235245f22832860544f17ba386442fe7e9d629f8cbedf87
    steps:
      - uses: actions/checkout@v5
      - name: Install shellcheck ${{ env.SHELLCHECK_VERSION }}
        run: |
          curl -fsSL -o shellcheck.tar.xz \
            "https://github.com/koalaman/shellcheck/releases/download/${SHELLCHECK_VERSION}/shellcheck-${SHELLCHECK_VERSION}.linux.x86_64.tar.xz"
          echo "${SHELLCHECK_SHA256}  shellcheck.tar.xz" | sha256sum -c -
          tar -xJf shellcheck.tar.xz
          sudo install "shellcheck-${SHELLCHECK_VERSION}/shellcheck" /usr/local/bin/shellcheck
          shellcheck --version
      - name: Check installation scripts
        run: |
          # installation/*.sh plus every installation/prometheus-* whose first line is a sh/bash shebang
          mapfile -t files < <(for f in installation/*.sh installation/prometheus-*; do
            head -n1 "$f" | grep -qE '^#!.*(/|env )(ba)?sh([[:space:]]|$)' && echo "$f"; done)
          printf '%s\n' "${files[@]}"
          shellcheck "${files[@]}"

  python:
    name: Python tools (compile)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'   # the Python of Raspberry Pi OS Trixie
      - name: Compile every installation/prometheus-* with a python3 shebang
        run: |
          mapfile -t files < <(for f in installation/prometheus-*; do
            head -n1 "$f" | grep -qE '^#!.*python3' && echo "$f"; done)
          printf '%s\n' "${files[@]}"
          python -m py_compile "${files[@]}"

  cloud-init:
    name: First boot settings (cloud-init schema)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Install cloud-init
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq cloud-init
          cloud-init --version
      - name: Validate installation/user-data
        run: |
          # enable_ssh is a Raspberry Pi OS addition that the upstream schema does not know:
          # it is removed from a temporary copy, everything else is checked as is.
          grep -v '^enable_ssh:' installation/user-data > "$RUNNER_TEMP/user-data"
          cloud-init schema --config-file "$RUNNER_TEMP/user-data"
