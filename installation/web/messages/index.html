<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title data-en="Messages">Messages</title>
<link rel="stylesheet" href="/style.css">
<link rel="stylesheet" href="/theme.css">
<script src="/langue.js"></script>
<script src="/annonce.js"></script>
<script>
// Bouton « retour » : le navigateur reaffiche une page gardee en memoire ; on reprend les couleurs du moment
addEventListener('pageshow', function (e) { if (e.persisted) document.querySelector('link[href^="/theme.css"]').href = '/theme.css?' + Date.now(); });
</script>
<style>
  main { padding-bottom: 150px; }

  /* Fil des messages : le plus recent en bas. Pas de bulles : un nom, une heure, le texte. */
  .fil { display: flex; flex-direction: column; }
  /* Un intertitre par jour : la date complete n'est ecrite qu'une fois */
  .jour { color: var(--gris); font-size: .72rem; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; padding: 26px 0 8px; border-bottom: 1px solid var(--encre); }
  .jour:first-child { padding-top: 6px; }
  .msg { padding: 14px 2px; border-bottom: 1px solid var(--trait); }
  .entete-msg { display: flex; align-items: baseline; gap: 10px; margin-bottom: 3px; }
  .entete-msg b { font-weight: 650; }
  .date { color: var(--pale); font-size: .8rem; font-variant-numeric: tabular-nums; }
  /* Passe par la radio : un mot discret a cote de l'heure */
  .signe-radio { font-size: .68rem; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: var(--gris); border: 1px solid var(--trait); border-radius: 4px; padding: 1px 5px; }
  .texte-msg { white-space: pre-wrap; overflow-wrap: break-word; line-height: 1.5; }
  .effacer { margin-left: auto; font: inherit; font-size: .8rem; color: var(--pale); background: none; border: 0; cursor: pointer; padding: 0 2px; }
  .effacer:hover { color: #c92a2a; }

  .vide-fil { color: var(--gris); padding: 40px 2px; border-top: 1px solid var(--trait); }

  /* Barre d'ecriture fixee en bas */
  .barre { position: fixed; left: 0; right: 0; bottom: 0; background: var(--fond); border-top: 1px solid var(--trait); padding: 10px 20px calc(12px + env(safe-area-inset-bottom)); }
  .barre .interieur { max-width: 600px; margin: 0 auto; }
  .qui { font-size: .85rem; color: var(--gris); margin: 0 2px 8px; display: flex; gap: 8px; align-items: center; }
  .qui button { font: inherit; color: var(--encre); background: none; border: 0; border-bottom: 1px solid var(--trait); padding: 0; cursor: pointer; }
  .qui input { font: inherit; font-size: .9rem; color: var(--encre); background: var(--carte); border: 1px solid var(--trait); border-radius: 6px; padding: 5px 10px; width: 180px; outline: none; }
  .saisie { display: flex; gap: 8px; align-items: flex-end; }
  .saisie textarea { flex: 1; resize: none; font: inherit; font-size: 1.02rem; color: var(--encre); background: var(--carte); border: 1px solid var(--trait); border-radius: var(--rayon); padding: 11px 14px; max-height: 140px; outline: none; line-height: 1.35; }
  .saisie textarea:focus { border-color: var(--encre); }
  .envoyer { width: 46px; height: 46px; flex: none; border-radius: var(--rayon); border: 0; background: var(--encre); color: var(--fond); display: flex; align-items: center; justify-content: center; cursor: pointer; transition: opacity .15s ease; }
  .envoyer:disabled { opacity: .25; cursor: default; }
  .erreur { color: #c92a2a; font-size: .85rem; margin: 6px 2px 0; min-height: 0; }

  /* Radio : case « envoyer aussi par radio » et compteur */
  .radio-choix { display: flex; align-items: center; gap: 8px; font-size: .88rem; color: var(--gris); margin: 8px 2px 0; cursor: pointer; }
  .radio-choix[hidden] { display: none; }
  .radio-choix input { width: 18px; height: 18px; accent-color: var(--accent); margin: 0; }
  .radio-compte { margin-left: auto; font-variant-numeric: tabular-nums; }
  .radio-compte.trop { color: #d62828; font-weight: 600; }
  .radio-note { font-size: .82rem; color: var(--gris); margin: 4px 4px 0; }
  .radio-note:empty { display: none; }
</style>
</head>
<body>
<main>
  <a class="retour" id="retour" href="/" data-en="← Home">← Accueil</a>
  <h1 data-en="Messages">Messages</h1>
  <p class="sous-titre" data-en="Visible to everyone connected to the station.">Visibles par tous ceux qui sont connectés à la station.</p>
  <div class="fil" id="fil"></div>
  <p class="vide-fil" id="vide" hidden data-en="No messages yet. Write the first one below.">Aucun message pour l’instant. Écrivez le premier ci-dessous.</p>
</main>

<div class="barre">
  <div class="interieur">
    <div class="qui" id="qui">
      <span id="qui-texte"></span>
      <button id="qui-changer" type="button" data-en="change">changer</button>
      <input id="nom" maxlength="40" placeholder="Votre prénom" data-en-ph="Your first name" autocomplete="given-name" hidden>
    </div>
    <form class="saisie" id="form">
      <textarea id="texte" rows="1" maxlength="500" placeholder="Écrire un message…" data-en-ph="Write a message…"></textarea>
      <button class="envoyer" id="envoyer" disabled aria-label="Envoyer" data-en-aria="Send">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5"/><path d="M5 12l7-7 7 7"/></svg>
      </button>
    </form>
    <label class="radio-choix" id="radio-choix" hidden>
      <input type="checkbox" id="par-radio">
      <span data-en="Also send by radio">Envoyer aussi par radio</span>
      <span class="radio-compte" id="radio-compte"></span>
    </label>
    <p class="radio-note" id="radio-note"></p>
    <p class="erreur" id="erreur"></p>
  </div>
</div>

<script>
function $(id) { return document.getElementById(id); }
// Ouverte depuis les Parametres : le lien de retour y ramene
if (new URLSearchParams(location.search).get('depuis') === 'parametres') {
  $('retour').href = '/parametres/#messages';
  $('retour').dataset.en = '← Settings';
  $('retour').textContent = '← Paramètres';
}
var ecart = 0, nom = '', dernierId = null, radio = { active: false, peut: false };
var MAX_RADIO = 228;   // octets au plus dans un message radio (le prenom part devant le texte)

// La date complete, une fois par jour en intertitre (utile des mois plus tard) ; l'heure sous chaque message
function leJour(t) {
  var j = new Date(t * 1000).toLocaleDateString(LANGUE === 'en' ? 'en-GB' : 'fr-FR', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
  return j.charAt(0).toUpperCase() + j.slice(1);
}
function lHeure(t) {
  return new Date(t * 1000).toLocaleTimeString(LANGUE === 'en' ? 'en-GB' : 'fr-FR', { hour: '2-digit', minute: '2-digit' });
}

function afficherNom() {
  $('qui-texte').innerHTML = '';
  if (nom) {
    $('qui-texte').appendChild(document.createTextNode(T('Vous écrivez en tant que ', 'Writing as ')));
    var b = document.createElement('b'); b.textContent = nom; $('qui-texte').appendChild(b);
    $('qui-changer').hidden = false; $('nom').hidden = true;
  } else {
    $('qui-texte').textContent = T('Votre prénom :', 'Your first name:');
    $('qui-changer').hidden = true; $('nom').hidden = false;
  }
}

function charger() {
  fetch('/api/messages', { cache: 'no-store' }).then(function (r) { return r.json(); }).then(function (d) {
    ecart = d.maintenant - Date.now() / 1000;
    if (d.radio) { radio = d.radio; afficherRadio(); }
    var messages = d.messages.slice().reverse();   // le plus ancien en haut, le plus recent en bas
    var fil = $('fil'), basAvant = innerHeight + scrollY >= document.body.scrollHeight - 80;
    fil.innerHTML = '';
    var jourPrecedent = '';
    messages.forEach(function (m) {
      var jour = leJour(m.heure);
      if (jour !== jourPrecedent) {
        var j = document.createElement('div'); j.className = 'jour'; j.textContent = jour;
        fil.appendChild(j); jourPrecedent = jour;
      }
      var qui = m.nom || T('Anonyme', 'Anonymous');
      var msg = document.createElement('div'); msg.className = 'msg';
      var tete = document.createElement('div'); tete.className = 'entete-msg';
      var b = document.createElement('b'); b.textContent = qui;
      // L'heure seule (la date est dans l'intertitre), et un mot discret si le message est passe par la radio
      var date = document.createElement('time'); date.className = 'date'; date.textContent = lHeure(m.heure);
      tete.appendChild(b); tete.appendChild(date);
      if (m.radio) {
        var r = document.createElement('span'); r.className = 'signe-radio';
        r.textContent = m.radio === 'attente' ? T('radio · en attente', 'radio · waiting') : 'radio';
        tete.appendChild(r);
      }
      if (d.admin) {
        var x = document.createElement('button'); x.className = 'effacer'; x.textContent = T('Effacer', 'Delete');
        x.onclick = function () {
          fetch('/api/messages/effacer', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ id: m.id }) }).then(charger);
        };
        tete.appendChild(x);
      }
      var texte = document.createElement('div'); texte.className = 'texte-msg'; texte.textContent = m.texte;
      msg.appendChild(tete); msg.appendChild(texte);
      fil.appendChild(msg);
    });
    $('vide').hidden = messages.length > 0;
    // On descend au plus recent a l'ouverture, ou quand un nouveau message arrive alors qu'on etait en bas
    var nouveau = messages.length ? messages[messages.length - 1].id : null;
    if (dernierId === null || (nouveau !== dernierId && basAvant)) scrollTo(0, document.body.scrollHeight);
    dernierId = nouveau;
  }).catch(function () {});
}

// Radio : la case n'apparait que si la radio est activee (et permise a ce telephone)
function octets(t) { return new TextEncoder().encode(t).length; }
function resteRadio() {
  var n = ($('nom').hidden ? nom : $('nom').value.trim());
  var envoi = (n ? n + ' : ' : '') + $('texte').value.trim().split(/\s+/).join(' ');
  return (radio.max || MAX_RADIO) - octets(envoi);   // la limite depend du reseau (Meshtastic, MeshCore)
}
function afficherRadio() {
  $('radio-choix').hidden = !radio.peut;
  if (!radio.peut) $('par-radio').checked = false;
  var coche = $('par-radio').checked, reste = resteRadio();
  $('radio-compte').textContent = coche ? (reste >= 0 ? T('reste ', '') + reste + T('', ' left') : T('trop long de ', 'too long by ') + (-reste)) : '';
  $('radio-compte').className = 'radio-compte' + (coche && reste < 0 ? ' trop' : '');
  $('radio-note').textContent = !coche ? '' : radio.etat === 'absente' ? T('La radio n’est pas branchée : le message partira dès qu’elle le sera.', 'The radio is not plugged in: the message will go as soon as it is.')
    : radio.etat === 'muette' ? T('La radio ne répond pas : le message partira dès qu’elle répondra.', 'The radio does not respond: the message will go as soon as it does.') : '';
  $('envoyer').disabled = !$('texte').value.trim() || (coche && reste < 0);
}
$('par-radio').onchange = function () { try { localStorage.setItem('par-radio', this.checked ? '1' : ''); } catch (e) {} afficherRadio(); };

// Le champ grandit avec le texte
$('texte').addEventListener('input', function () {
  this.style.height = 'auto'; this.style.height = Math.min(this.scrollHeight, 140) + 'px';
  $('envoyer').disabled = !this.value.trim();
  afficherRadio();
});
// Entree envoie (Maj + Entree = retour a la ligne)
$('texte').addEventListener('keydown', function (e) {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); $('form').requestSubmit(); }
});
$('qui-changer').onclick = function () { $('nom').hidden = false; $('nom').value = nom; $('nom').focus(); this.hidden = true; $('qui-texte').textContent = T('Votre prénom :', 'Your first name:'); };
$('nom').addEventListener('change', function () { nom = this.value.trim(); try { localStorage.setItem('nom', nom); } catch (e) {} afficherNom(); charger(); });

$('form').onsubmit = function (ev) {
  ev.preventDefault();
  var texte = $('texte').value.trim();
  if (!texte) return;
  if (!$('nom').hidden) { nom = $('nom').value.trim(); try { localStorage.setItem('nom', nom); } catch (e) {} }
  $('envoyer').disabled = true; $('erreur').textContent = '';
  fetch('/api/messages', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ nom: nom, texte: texte, radio: $('par-radio').checked }) })
    .then(function (r) { return r.json().then(function (d) { return { ok: r.ok, d: d }; }); })
    .then(function (r) {
      if (r.ok) { $('texte').value = ''; $('texte').style.height = 'auto'; afficherNom(); dernierId = 'x'; charger(); setTimeout(function () { scrollTo(0, document.body.scrollHeight); }, 300); }
      else { $('erreur').textContent = TE(r.d.erreur) || T('Erreur.', 'Error.'); $('envoyer').disabled = false; }
    })
    .catch(function () { $('erreur').textContent = T('La station ne répond pas.', 'The station does not respond.'); $('envoyer').disabled = false; });
};

try { nom = localStorage.getItem('nom') || ''; $('par-radio').checked = localStorage.getItem('par-radio') === '1'; } catch (e) {}
afficherNom();
charger();
setInterval(charger, 15000);   // les nouveaux messages arrivent tout seuls
</script>
</body>
</html>
